version: 2

models:
  - name: stg_customers
    description: Staged customer records.
    columns:
      - name: customer_id
        description: Unique identifier for each customer.
        tests:
          - unique
          - not_null

  - name: stg_orders
    description: Staged order transaction records.
    columns:
      - name: order_id
        description: Unique identifier for each order.
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Reference to the customer table.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

  - name: stg_events
    description: Staged web activity clickstream logs.
    columns:
      - name: event_id
        description: Unique identifier for each event.
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Reference to the customer table.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
