name: CI-CD Data Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check SQL Formatting (sqlfluff)
      run: |
        # Lint staging and marts SQL files using sqlfluff
        sqlfluff lint dbt_project/models --dialect duckdb

    - name: Run Data Ingestion (Seed raw tables)
      run: |
        python src/ingestion.py

    - name: Run dbt Build (Transform and Test)
      run: |
        dbt build --project-dir dbt_project --profiles-dir dbt_project
