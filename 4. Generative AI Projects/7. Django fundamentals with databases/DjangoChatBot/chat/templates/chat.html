<!DOCTYPE html>
<html>
  <head>
    <title>Gemini Chatbot</title>

    <!-- Bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />

    <style>
      body {
        background: #f5f5f5;
      }
      .chat-window {
        height: 450px;
        overflow-y: auto;
        background: #ffffff;
        border-radius: 10px;
        padding: 20px;
        border: 1px solid #ddd;
      }
      /* AI Markdown Styling */
      .ai-message h1,
      .ai-message h2,
      .ai-message h3 {
        font-weight: 600;
        margin-top: 1rem;
      }
      .ai-message p {
        margin-bottom: 0.4rem;
      }
      .ai-message code {
        background: #eee;
        padding: 3px 4px;
        border-radius: 4px;
      }
      .ai-message pre {
        background: #222;
        color: #eee;
        padding: 12px;
        border-radius: 8px;
        overflow-x: auto;
      }
      .ai-message blockquote {
        border-left: 4px solid #ccc;
        padding-left: 12px;
        margin-left: 0;
        color: #555;
      }
    </style>
  </head>

  <body>
    <div class="container py-5">
      <h2 class="text-center mb-4">🤖 Gemini Chatbot (Django + LangChain)</h2>

      <div class="chat-window mb-4">
        {% for msg in history %} {% if msg.type == "human" %}
        <div class="text-end mb-4">
          <span class="badge bg-primary mb-1">You</span>
          <div
            class="p-2 rounded bg-primary text-white d-inline-block"
            style="max-width: 75%"
          >
            {{ msg.content }}
          </div>
        </div>

        {% elif msg.type == "ai" %}
        <div class="text-start mb-4">
          <span class="badge bg-success mb-1">AI</span>
          <div
            class="p-3 rounded border bg-light ai-message"
            style="max-width: 85%"
          >
            {{ msg.content|safe }}
          </div>
        </div>

        {% endif %} {% endfor %}
      </div>

      <form method="POST">
        {% csrf_token %}
        <div class="input-group">
          <input
            type="text"
            name="message"
            placeholder="Type your message..."
            class="form-control form-control-lg"
            required
          />
          <button class="btn btn-dark btn-lg">Send</button>
        </div>
      </form>
    </div>
  </body>
</html>
