{% extends "blog/base.html" %} {% load static %} {% block content %}
<div class="container mt-4">
  <h2>Create Post</h2>

  <form method="POST">
    {% csrf_token %} {{ form.as_p }}

    <button type="submit" class="btn btn-success">Create</button>
    <a href="{% url 'post-list' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
